<!-- GLASS PHASE 1 — vertical home (Pinned row + dynamic All Apps row). Baseline kept in app/src/main/assets_baseline/. -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920,initial-scale=1">
<title>Glass Launcher</title>
<style>
html{font-size:1.0417vw}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0b14;color:#fff;font-family:"SamsungOne","Helvetica Neue",Arial,sans-serif}
#wp{position:fixed;top:0;left:0;right:0;bottom:0;background:center/cover no-repeat}
#wpd{position:fixed;top:0;left:0;right:0;bottom:0;background:center/cover no-repeat;opacity:0;transition:opacity .7s ease}
body.dark #wpd{opacity:1}
#wpd.fallback{filter:brightness(.4) saturate(.8)}
#shade{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 35%,rgba(0,0,0,.5))}
.glass{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1rem 2.4rem rgba(0,0,0,.28);-webkit-backdrop-filter:blur(2rem) saturate(1.8);backdrop-filter:blur(2rem) saturate(1.8)}
@supports not (backdrop-filter:blur(1px)){.glass{background:rgba(40,40,52,.78)}}
#moon{z-index:10;position:fixed;top:3rem;right:3.6rem;width:2.8rem;height:2.8rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .25s,box-shadow .25s}
#moon img{width:1.5rem;height:1.5rem;filter:invert(1) drop-shadow(0 .05rem .2rem rgba(0,0,0,.4));transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .25s}
#moon.spin img{transform:rotate(180deg) scale(.4);opacity:0}
#moon.f{transform:scale(1.15);box-shadow:0 0 0 .18rem rgba(255,255,255,.95)}
#head{pointer-events:none;position:fixed;top:0;left:0;width:100%;text-align:center;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
#date{font-size:1.5rem;font-weight:600;letter-spacing:.02em;opacity:.9;text-shadow:0 .1rem .6rem rgba(0,0,0,.35);margin-top:5vh}
#clock{font-size:11rem;font-weight:700;line-height:1.1;letter-spacing:-.02em;background:linear-gradient(180deg,rgba(255,255,255,.96) 10%,rgba(255,255,255,.18) 95%);-webkit-background-clip:text;background-clip:text;color:transparent}
body.scrolled #head{transform:translateY(-14vh) scale(.6);opacity:.55}

#rowsWrap{position:fixed;left:0;width:100%;bottom:6vh;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.row{margin-top:3.6rem}
.row:first-child{margin-top:0}
.rowLabel{padding-left:4.4rem;margin-bottom:.9rem;font-size:1.15rem;font-weight:700;letter-spacing:.02em;opacity:.65;text-shadow:0 .1rem .5rem rgba(0,0,0,.4);transition:opacity .25s}
.row.active .rowLabel{opacity:1}
.dock{display:flex;gap:1.4rem;padding:1.6rem 3.6rem;border-radius:2.4rem;overflow:hidden;white-space:nowrap}
.tile{position:relative;width:13rem;height:7.8rem;border-radius:1.1rem;display:grid;place-items:center;font-weight:800;text-align:center;line-height:1;overflow:hidden;background:#222;transition:box-shadow .25s;font-size:1.6rem}
.tile img{width:100%;height:100%;object-fit:cover}
.tile::after{content:"";position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%)}
.slot{position:relative;flex:0 0 auto;transform-origin:50% 50%;transition:transform .18s cubic-bezier(.2,.8,.2,1);will-change:transform}
.slot::before{content:"";position:absolute;top:-.35rem;left:-.35rem;right:-.35rem;bottom:-.35rem;border-radius:1.45rem;border:.12rem solid rgba(255,255,255,.85);background:rgba(255,255,255,.2);box-shadow:inset 0 .08rem 0 rgba(255,255,255,.55),0 .8rem 1.8rem rgba(0,0,0,.35);-webkit-backdrop-filter:blur(.8rem) saturate(1.6);backdrop-filter:blur(.8rem) saturate(1.6);opacity:0;transition:opacity .2s;pointer-events:none}
.slot.f::before{opacity:1}
.slot.f .tile{box-shadow:0 1.2rem 2.2rem rgba(0,0,0,.5)}
.slot.f .tile::after{transform:translateX(120%);transition:transform .7s ease}
.slot.f{z-index:3}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:1rem 1.6rem;border-radius:1.2rem;font-size:1.1rem;opacity:0;transition:opacity .3s;pointer-events:none;background:rgba(30,30,40,.85);z-index:30}
#toast.on{opacity:1}
body.lite .glass,body.lite .slot::before{-webkit-backdrop-filter:none;backdrop-filter:none}
body.lite .glass{background:rgba(30,30,46,.5)}
body.lite .slot::before{background:rgba(255,255,255,.3)}
#ids{display:none;position:fixed;top:8vh;left:10%;width:80%;height:84%;overflow:hidden;padding:2rem 2.6rem;border-radius:1.6rem;font-size:1.15rem;line-height:1.75;z-index:20;background:rgba(18,18,28,.95)}
#ids.on{display:block}
#ids h3{font-size:1.4rem;margin-bottom:.8rem}
#ids b{display:inline-block;width:22rem;font-weight:600}
#ids span{opacity:.7}
#empty{padding-left:4.4rem;font-size:1.05rem;opacity:.6}
</style></head>
<body>
<div id="wp"></div><div id="wpd"></div><div id="shade"></div>
<div id="moon" class="glass" title="Light / dark"><img id="moonimg" alt=""></div>
<div id="head"><div id="date"></div><div id="clock"></div></div>
<div id="rowsWrap">
  <div class="row" id="rowPinned"><div class="rowLabel">Pinned</div><div class="dock glass" id="dock"></div></div>
  <div class="row" id="rowLibrary"><div class="rowLabel">All Apps</div><div class="dock glass" id="library"></div></div>
</div>
<div id="ids" class="glass"></div>
<div id="toast" class="glass"></div>
<script src="apps.js"></script>
<script>
(function(){
var pinnedApps=window.APPS||[], T=window.THEME||{};
var moon=document.getElementById('moon'), moonimg=document.getElementById('moonimg');
var dockEl=document.getElementById('dock'), libEl=document.getElementById('library');
var rowsWrap=document.getElementById('rowsWrap');
var onMoon=false, dark=false, tt;
var PEAK=0.24, REACH=1.9;

/* ---------- sounds ---------- */
var SOUND=window.SOUND||{enabled:true,volume:.6};
function mkSound(src){
  var pool=[],n=0,i;
  for(i=0;i<3;i++){var a=new Audio(src); a.preload='auto'; try{a.load();}catch(e){} pool.push(a);}
  return function(){
    if(SOUND.enabled===false) return;
    var a=pool[n++%pool.length];
    try{a.volume=(SOUND.volume==null?.6:SOUND.volume); a.currentTime=0; var pr=a.play(); if(pr&&pr.catch) pr.catch(function(){});}catch(e){}
  };
}
var playNav=mkSound('sounds/navigate.wav'), playClick=mkSound('sounds/click.wav');

/* ---------- rows ---------- */
var rows=[
  {key:'pinned', el:document.getElementById('rowPinned'), dock:dockEl, items:[], col:0},
  {key:'library', el:document.getElementById('rowLibrary'), dock:libEl, items:[], col:0}
];
var vpos=0; // -1 = moon, else index into rows

function initials(n){ if(!n) return '?'; var w=n.trim().split(/\s+/); return (w[0][0]+(w[1]?w[1][0]:'')).toUpperCase(); }
function buildSlot(a, dock){
  var s=document.createElement('div'); s.className='slot';
  var t=document.createElement('div'); t.className='tile';
  t.style.background=a.bg||'#222'; t.style.color=a.fg||'#fff'; t.style.fontSize=(a.size||1)+'rem';
  var im=null;
  if(a.icon){im=new Image(); im.onerror=function(){im.style.display='none';t.textContent=a.text||initials(a.name)}; t.appendChild(im);}
  else t.textContent=a.text||initials(a.name);
  s.appendChild(t); dock.appendChild(s);
  return {el:s,tile:t,img:im,item:a};
}

/* Pinned row: fixed, from apps.js */
pinnedApps.forEach(function(a){
  var o=buildSlot(a, dockEl); rows[0].items.push(o);
  o.el.addEventListener('mouseenter',function(){vpos=0; rows[0].col=rows[0].items.indexOf(o); onMoon=false; render();});
  o.el.addEventListener('click',function(){go(a);});
});

/* Library row: dynamic, from AndroidBridge.getInstalledApps() */
var installed=[];
function pinnedIds(){ return pinnedApps.map(function(a){return a.id;}).filter(Boolean); }
function buildLibrary(){
  libEl.innerHTML=''; rows[1].items=[];
  var pids=pinnedIds();
  var list=installed.filter(function(x){return x.show!==false && !/^(org\.tizen|com\.samsung|DU\.TV\.PRODA)/i.test(x.id) && pids.indexOf(x.id)===-1;})
    .sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;});
  var ex=document.getElementById('empty'); if(ex) ex.remove();
  if(!list.length){
    var e=document.createElement('div'); e.id='empty'; e.textContent='No other apps found.'; rows[1].dock.parentNode.appendChild(e);
    return;
  }
  list.forEach(function(x){
    var a={name:x.name,id:x.id,text:initials(x.name)};
    var o=buildSlot(a, libEl); rows[1].items.push(o);
    o.el.addEventListener('mouseenter',function(){vpos=1; rows[1].col=rows[1].items.indexOf(o); onMoon=false; render();});
    o.el.addEventListener('click',function(){go(a);});
  });
}
function loadInstalled(){
  try {
    var raw=AndroidBridge.getInstalledApps();
    installed=JSON.parse(raw||'[]');
    rows[0].items.forEach(function(o){ var a=o.item; if(!a.id) return;
      var found=false; for(var j=0;j<installed.length;j++) if(installed[j].id===a.id) found=true;
      if(!found){ for(var k=0;k<installed.length;k++) if(installed[k].show!==false && a.match && a.match.test(installed[k].name)){a.id=installed[k].id;break;} }
    });
  } catch(e) { installed=[]; }
  buildLibrary();
}

/* ---------- macOS-style magnification (active row only) ---------- */
function centerOf(dock,o){return dock.getBoundingClientRect().left+dock.clientLeft+o.el.offsetLeft+o.el.offsetWidth/2;}
function layoutRow(r, cx){
  var items=r.items, n=items.length; if(!n) return;
  var rects=items.map(function(o){return {c:centerOf(r.dock,o),w:o.el.offsetWidth};});
  var tw=rects[0].w, sc=[], extra=[], tot=0, i;
  for(i=0;i<n;i++){
    var d=Math.abs(rects[i].c-cx)/(tw*REACH);
    var k=d>=1?0:(Math.cos(d*Math.PI)+1)/2;
    sc[i]=1+PEAK*k; extra[i]=tw*(sc[i]-1); tot+=extra[i];
  }
  var run=0;
  for(i=0;i<n;i++){
    var shift=run+extra[i]/2-tot/2; run+=extra[i];
    items[i].el.style.transform='translateX('+shift.toFixed(1)+'px) scale('+sc[i].toFixed(3)+')';
  }
}
function restRow(r, isActive){
  if(!isActive || onMoon || !r.items[r.col]){ r.items.forEach(function(o){o.el.style.transform='';}); return; }
  layoutRow(r, centerOf(r.dock, r.items[r.col]));
}
rows.forEach(function(r,ri){
  r.dock.addEventListener('mousemove',function(e){vpos=ri; onMoon=false; layoutRow(r,e.clientX);});
  r.dock.addEventListener('mouseleave',function(){render();});
});

/* ---------- focus / scroll ---------- */
var lastKey=null;
function render(silent){
  rows.forEach(function(r,ri){
    r.items.forEach(function(o){o.el.classList.remove('f');});
    r.el.classList.toggle('active', ri===vpos && !onMoon);
    if(ri===vpos && !onMoon && r.items[r.col]) r.items[r.col].el.classList.add('f');
    restRow(r, ri===vpos && !onMoon);
  });
  moon.classList.toggle('f', onMoon);
  document.body.classList.toggle('scrolled', vpos>=1 && !onMoon);
  var jump = (vpos>=1 && !onMoon) ? vpos*9.4 : 0;
  rowsWrap.style.transform = jump ? 'translateY('+(-jump)+'rem)' : '';
  var key=onMoon?'moon':(vpos+':'+(rows[vpos]?rows[vpos].col:0));
  if(lastKey!==null && key!==lastKey && !silent) playNav();
  lastKey=key;
}
moon.addEventListener('mouseenter',function(){onMoon=true;render();});
moon.addEventListener('mouseleave',function(){onMoon=false;render(true);});
moon.addEventListener('click',function(){toggle();});

/* ---------- theme (light / dark) ---------- */
var wpL=document.getElementById('wp'), wpD=document.getElementById('wpd');
wpL.style.backgroundImage='url('+(T.wallpaperLight||'wallpaper.jpg')+')';
(function(){var p=new Image();
  p.onload=function(){wpD.style.backgroundImage='url('+T.wallpaperDark+')';};
  p.onerror=function(){wpD.style.backgroundImage='url('+(T.wallpaperLight||'wallpaper.jpg')+')';wpD.classList.add('fallback');};
  p.src=T.wallpaperDark||'wallpaper2.jpg';})();
function applyTheme(animate){
  document.body.classList.toggle('dark',dark);
  rows[0].items.forEach(function(o){ if(o.img) o.img.src=(dark&&o.item.dark)?o.item.dark:o.item.icon; });
  var src=dark?(T.iconDark||'moonsun/moon-filled.png'):(T.iconLight||'moonsun/sun-filled.png');
  if(animate){moon.classList.add('spin'); setTimeout(function(){moonimg.src=src; moon.classList.remove('spin');},250);}
  else moonimg.src=src;
}
function toggle(){ playClick(); dark=!dark; applyTheme(true); }
/* auto dark mode: dark from 19:00 to 07:00. The moon/sun button overrides until the next automatic switch. */
function night(){var h=new Date().getHours();return h>=19||h<7;}
dark=night(); var lastNight=dark;

/* ---------- launch + keys ---------- */
function toast(m){var t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){t.classList.remove('on')},3200);}
function exitApp(){ try{AndroidBridge.goHome();}catch(e){toast('Use Home to leave Glass Launcher');} }

var idsEl=document.getElementById('ids');
function showIds(){
  idsEl.innerHTML=''; var h=document.createElement('h3'); h.textContent='Installed apps and their IDs (Up/Down to scroll, Back to close)'; idsEl.appendChild(h);
  if(!installed.length){var m=document.createElement('div'); m.textContent='No app list available.'; idsEl.appendChild(m);}
  installed.filter(function(x){return x.show!==false&&!/^(org\.tizen|com\.samsung)\./.test(x.id);})
    .sort(function(a,b){return a.name.toLowerCase()<b.name.toLowerCase()?-1:1;})
    .forEach(function(x){var d=document.createElement('div'),b=document.createElement('b'),s=document.createElement('span'); b.textContent=x.name; s.textContent=x.id; d.appendChild(b); d.appendChild(s); idsEl.appendChild(d);});
  idsEl.scrollTop=0; idsEl.classList.add('on');
}
function idsOpen(){return idsEl.classList.contains('on');}
function go(a){
  playClick();
  if(a.action==='list'){showIds();return;}
  if(a.action==='exit'){exitApp();return;}
  if(!a.id){toast('Set the app ID for '+a.name+' in apps.js');return;}
  try{ if(!AndroidBridge.launchPackage(a.id)) toast(a.name+' is not installed on this box.'); } catch(e){toast(a.name+' could not be opened.');}
}
document.addEventListener('keydown',function(e){
  var k=e.keyCode, used=true;
  if(idsOpen()){ if(k===40)idsEl.scrollTop+=120; else if(k===38)idsEl.scrollTop-=120; else if(k===10009||k===13)idsEl.classList.remove('on'); e.preventDefault(); return; }
  if(k===37){ if(!onMoon && rows[vpos]) rows[vpos].col--; }
  else if(k===39){ if(!onMoon && rows[vpos]) rows[vpos].col++; }
  else if(k===38){ if(!onMoon){ if(vpos<=0) onMoon=true; else vpos--; } }
  else if(k===40){ if(onMoon){onMoon=false;vpos=0;} else if(vpos<rows.length-1) vpos++; }
  else if(k===13){ if(onMoon) toggle(); else { var r=rows[vpos]; var o=r&&r.items[r.col]; if(o) go(o.item); } }
  else if(k===10009){exitApp();}
  else used=false;
  if(used){
    e.preventDefault();
    if(!onMoon && rows[vpos]) rows[vpos].col=Math.max(0,Math.min(rows[vpos].col, rows[vpos].items.length-1));
    render();
  }
});
window.addEventListener('resize',function(){render(true);});

function tick(){
  var d=new Date(), h=d.getHours()%12||12, m=('0'+d.getMinutes()).slice(-2);
  document.getElementById('clock').textContent=h+':'+m;
  var n=night(); if(n!==lastNight){lastNight=n;dark=n;applyTheme(true);}
  document.getElementById('date').textContent=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
}
if((window.PERF||{lite:true}).lite!==false) document.body.classList.add('lite');
loadInstalled(); applyTheme(false); tick(); setInterval(tick,10000); render(true);
})();
</script>
</body></html>
