<!-- GLASS PHASE 6. Earlier: GLASS PHASE 4 (visual refinement; Phase 3 copy of this file: assets_phase3/). Phase 3: modular launcher. Styles in css/, logic in js/ (glass, icons, appdata, theme, home, controlcentre, registry, shortcuts, search, main). Phase 2 copy: assets_phase2/ -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Glass Launcher</title>
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/recent.css">
<link rel="stylesheet" href="css/controlcentre.css">
<link rel="stylesheet" href="css/search.css">
</head>
<body>
<div id="wp"></div><div id="wpd"></div><div id="shade"></div>
<div id="head"><div id="date"></div><div id="clock"></div></div>
<div id="stage"><div id="rowsWrap"></div></div>

<div id="recent" class="glass" title="Recently used"><div class="rcap">Recently used</div><div id="rbody"><div id="rthumb"></div><div id="rname"></div></div><div id="rempty">Apps you open will appear here</div></div>

<div id="hdrBtns">
  <div id="searchbtn" class="hbtn glass" title="Search"><div id="searchico" class="hi"></div></div>
  <div id="ccbtn" class="hbtn glass" title="Control Centre"><div id="ccico" class="hi"></div></div>
</div>

<div id="ccScrim"></div>
<div id="cc" class="glass"><div id="cchead"><div id="cctime"></div><div id="ccdate"></div></div><div id="ccbody"><div id="ccinner"></div></div></div>

<div id="search">
  <div id="spanel" class="glass">
    <div id="sbar"><div id="ssico" class="si"></div><div id="sfield"><span id="sph">Search apps and settings</span><span id="stext"></span><span id="scaret"></span></div></div>
    <div id="sbody">
      <div id="sleft"><div id="sres"><div id="slist"></div></div></div>
      <div id="skb"></div>
    </div>
    <div id="shint"><span><b>OK</b>Select</span><span><b>Left</b>Results</span><span><b>Back</b>Close</span></div>
  </div>
</div>

<div id="ids" class="glass"></div>
<div id="toast" class="glass"></div>

<script src="apps.js"></script>
<script src="js/glass.js"></script>
<script src="js/icons.js"></script>
<script src="js/appdata.js"></script>
<script src="js/theme.js"></script>
<script src="js/recent.js"></script>
<script src="js/home.js"></script>
<script src="js/controlcentre.js"></script>
<script src="js/registry.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/search.js"></script>
<script src="js/main.js"></script>
</body></html>
