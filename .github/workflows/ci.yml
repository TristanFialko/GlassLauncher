name: CI

on:
  push:
    # main, plus the 2.0 consolidation branch (no PR of its own; PR #2 stays on glasslauncher-2.0-migration)
    branches: [main, glasslauncher-2.0-consolidated]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 27.2.12479018
  # Toolchain itself is pinned by rust/rust-toolchain.toml (1.91.0).

jobs:
  rust:
    name: Rust fmt / clippy / tests / parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo test
        working-directory: rust
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search parity (JavaScript registry.js vs Rust) + host benchmark
        run: |
          cargo build --locked --release -p glass-cli --manifest-path rust/Cargo.toml
          node tools/parity/search-parity.js --bench | tee parity.txt
      - name: Registry snapshot parity (production JavaScript fixtures vs Rust snapshot preparation)
        run: node tools/parity/snapshot-parity.js | tee -a parity.txt
      - name: Native UI config matches apps.js
        run: node tools/parity/nativeui-config-check.js
      - uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity.txt
      - name: Device benchmark harness - parser unit tests
        shell: pwsh
        run: ./tools/bench/test-bench-lib.ps1
      - name: Device benchmark harness - simulated Android 11 device (end to end)
        shell: pwsh
        run: ./tools/bench/test-bench-device.ps1

  bench-windows:
    # The owner runs the harness with Windows PowerShell 5.1, whose array/[pscustomobject] semantics differ from pwsh
    # (v2 lost renderer PSS that way), so the tests also run under 5.1 itself.
    name: Benchmark harness on Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parser unit tests (powershell.exe 5.1)
        shell: powershell
        run: $PSVersionTable.PSVersion; ./tools/bench/test-bench-lib.ps1
      - name: Simulated Android 11 device (powershell.exe 5.1)
        shell: powershell
        run: ./tools/bench/test-bench-device.ps1

  android:
    name: Android build + JVM/JNI tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}"
      - name: Install pinned Rust toolchain + Android targets
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug + release (unsigned) APKs, run JVM tests (real JNI against host libglass)
        run: ./gradlew --no-configuration-cache assembleDebug assembleRelease testDebugUnitTest assembleDebugAndroidTest
      - name: Check native libraries are packaged
        run: |
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "lib/$abi/libglass.so" || { echo "missing $abi"; exit 1; }
          done
          ls -l app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: glasslauncher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glasslauncher-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  baseline-apk:
    name: Baseline APK (rollback / benchmark comparison)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: glasslauncher-1.5-phase7-baseline
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0"
      - name: Build baseline debug APK
        # The baseline pins a JDK 25 daemon, which only breaks release lint; the debug build is unaffected.
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: glasslauncher-baseline-1.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  emulator:
    name: Instrumented test (x86_64 emulator, API 30)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}"
      - name: Install pinned Rust toolchain + emulator target
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@v4
      - name: connectedDebugAndroidTest
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            ./gradlew --no-configuration-cache connectedDebugAndroidTest -Pglass.rustAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.notClass=com.glasslauncher.NativeUiPrototypeTest || (adb logcat -d -s GlassBench:I GlassRust:I TestRunner:* AndroidRuntime:E; exit 1)
            adb logcat -d -s GlassBench:I GlassRust:I | tee emulator-bench.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-test-results
          path: |
            emulator-bench.txt
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  native-ui:
    # Native UI prototype vs WebView on an Android TV 1080p emulator profile (1920x1080 @ 320 dpi, like the VIP7802).
    # Screenshots + latency/gfxinfo logs are uploaded for review; emulator timings are not device performance.
    name: Native UI prototype (emulator, TV 1080p, API 30)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;34.0.0 ndk;${{ env.NDK_VERSION }}"
      - name: Install pinned Rust toolchain + emulator target
        working-directory: rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Native UI prototype test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb logcat -c
            ./gradlew --no-configuration-cache connectedDebugAndroidTest -Pglass.rustAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.glasslauncher.NativeUiPrototypeTest || (adb logcat -d -s GlassNative:* GlassNativeTest:* GlassLatency:* TestRunner:* AndroidRuntime:E; adb pull /data/local/tmp/glass-nativeui nativeui-out || true; exit 1)
            adb pull /data/local/tmp/glass-nativeui nativeui-out && adb logcat -d -s GlassNativeArtifact:I GlassLatency:I GlassNative:I > nativeui-out/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-ui-prototype
          path: |
            nativeui-out/
            app/build/reports/androidTests/
