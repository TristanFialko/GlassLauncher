[workspace]
resolver = "2"
members = ["glass-core", "glass-jni", "glass-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind" # required so catch_unwind at the JNI boundary can contain panics
strip = "symbols"
